name: Deploy to GitHub Pages

on:
  push:
    branches: [ shubham ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      
      - run: npm install
      - run: npm run build
      
      - uses: actions/upload-pages-artifact@v2
        with:
          path: ./dist
      
      - uses: actions/deploy-pages@v2